; Rev A product firmware.
;   pio run              build
;   pio run -t upload    reboot the running board into the bootloader and write
; BOOT still works: hold it and plug in if upload cannot see the device.

[platformio]
src_dir = src
default_envs = rev-a

[env:rev-a]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = openchord_m1
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
lib_archive = no
lib_compat_mode = off
lib_ldf_mode = deep+
upload_protocol = picotool

board_build.arduino.earlephilhower.usb_manufacturer = OpenChord
board_build.arduino.earlephilhower.usb_product = OpenChord M1

build_src_filter =
    +<*>
    +<../screen.cpp>
    +<../input.cpp>
    +<../../engine/session.cpp>
    +<../../engine/chord_engine.cpp>

build_flags =
    -DUSE_TINYUSB
    -I${PROJECT_DIR}
    -I${PROJECT_DIR}/../engine

lib_deps =
    fortyseveneffects/MIDI Library@^5.0.2
    adafruit/Adafruit TinyUSB Library@^3.7.7
