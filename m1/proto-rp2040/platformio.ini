; RP2040-Zero lab harness. Native USB-C = MIDI device (PC is host).
; Launchkey Mini MK4 pads/knobs fake the Orchid cluster + stick.

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
lib_archive = no
lib_compat_mode = off
lib_ldf_mode = deep+

board_build.arduino.earlephilhower.usb_manufacturer = OpenChord
board_build.arduino.earlephilhower.usb_product = OpenChord M1

build_flags =
    -DUSE_TINYUSB
    -I../engine

lib_deps =
    fortyseveneffects/MIDI Library@^5.0.2
    adafruit/Adafruit TinyUSB Library@^3.7.7
